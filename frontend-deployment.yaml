apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fixboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 885684264653.dkr.ecr.us-east-1.amazonaws.com/fixboard-frontend:v2
          ports:
            - containerPort: 80
