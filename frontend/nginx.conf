server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-proxy for the API: the backend has no /api prefix of its own
    # (routes are mounted at /auth, /posts, /tags, etc — see
    # backend/src/app.js), so this strips /api before forwarding. Keeping
    # the app's own API calls under a distinct /api/ prefix, rather than
    # the ALB routing bare paths like /posts to the backend, avoids that
    # prefix colliding with this SPA's own /posts/new and /posts/:id routes.
    # Only reachable in the Kubernetes deployment — local docker-compose
    # points the frontend straight at the backend container and never
    # exercises this location.
    location /api/ {
        proxy_pass http://backend-service.fixboard.svc.cluster.local:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: let React Router handle client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
