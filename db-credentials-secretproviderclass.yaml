# Replaces db-credentials-secret.yaml as the source of truth: AWS Secrets
# Manager holds the real values, and the Secrets Store CSI Driver syncs
# them into a Kubernetes Secret of the same name/shape the app already
# reads via envFrom — no changes needed to postgres-statefulset.yaml's
# env wiring, only its volumes/serviceAccountName (see that file).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fixboard-db-credentials-spc
  namespace: fixboard
spec:
  provider: aws
  secretObjects:
    - secretName: fixboard-db-credentials
      type: Opaque
      data:
        - objectName: POSTGRES_USER
          key: POSTGRES_USER
        - objectName: POSTGRES_PASSWORD
          key: POSTGRES_PASSWORD
        - objectName: POSTGRES_DB
          key: POSTGRES_DB
  parameters:
    objects: |
      - objectName: "fixboard/db-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: POSTGRES_USER
            objectAlias: POSTGRES_USER
          - path: POSTGRES_PASSWORD
            objectAlias: POSTGRES_PASSWORD
          - path: POSTGRES_DB
            objectAlias: POSTGRES_DB
