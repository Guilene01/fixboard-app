# Replaces backend-secrets-secret.yaml as the source of truth — see
# db-credentials-secretproviderclass.yaml for the full explanation.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fixboard-backend-secrets-spc
  namespace: fixboard
spec:
  provider: aws
  secretObjects:
    - secretName: fixboard-backend-secrets
      type: Opaque
      data:
        - objectName: JWT_SECRET
          key: JWT_SECRET
        - objectName: DATABASE_URL
          key: DATABASE_URL
  parameters:
    objects: |
      - objectName: "fixboard/backend-secrets"
        objectType: "secretsmanager"
        jmesPath:
          - path: JWT_SECRET
            objectAlias: JWT_SECRET
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
